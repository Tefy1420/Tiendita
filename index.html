<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8195F">
<meta name="description" content="Ventas, fiado, surtido y cuentas de la tiendita.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Tiendita">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mi Tiendita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-hand phone app — sticky header, scrolling panel, fixed bottom tabs; big tap targets */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E8ECE7; --line:#D5DBD3;
  --fg:#1C2421; --muted:#5C6862;
  --accent:#C8195F; --accent-ink:#FFFFFF; --accent-soft:#FBE3EC;
  --good:#0F7A5C; --good-soft:#DDF2EA; --warn:#B45309; --warn-soft:#FDEFD9; --bad:#B42318; --bad-soft:#FBE4E1;
  --display:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1B2220; --sunk:#232C29; --line:#33403B;
  --fg:#ECF1EE; --muted:#9AA8A1;
  --accent:#F0558F; --accent-ink:#1A0610; --accent-soft:#3A1828;
  --good:#4ACB9C; --good-soft:#15342A; --warn:#F2A54A; --warn-soft:#3A2A14; --bad:#F2796B; --bad-soft:#3D1D19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1B2220; --sunk:#232C29; --line:#33403B;
  --fg:#ECF1EE; --muted:#9AA8A1;
  --accent:#F0558F; --accent-ink:#1A0610; --accent-soft:#3A1828;
  --good:#4ACB9C; --good-soft:#15342A; --warn:#F2A54A; --warn-soft:#3A2A14; --bad:#F2796B; --bad-soft:#3D1D19;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;line-height:1;color:var(--accent)}
header.top .hoy{font-size:14px;color:var(--muted);text-align:right}
header.top .hoy b{color:var(--fg);font-size:17px}
main{padding:14px 16px 170px;max-width:720px;margin:0 auto;display:grid;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{border:0;border-radius:12px;padding:12px 16px;min-height:48px;font-weight:700;background:var(--sunk)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);color:var(--surface)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
input,select{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:42px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.qrbox{background:#FFFFFF;border-radius:var(--r);padding:12px;display:grid;place-items:center}
.qrbox img{width:100%;max-width:320px;height:auto;image-rendering:auto}
.copy{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:12px;padding:10px 12px}
.copy b{font-size:20px;letter-spacing:.04em;overflow-wrap:anywhere}
/* product tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;min-height:96px;display:grid;align-content:space-between;gap:6px}
.tile .n{font-weight:700;line-height:1.2}
.tile .p{font-family:var(--display);font-weight:700;font-size:20px}
.tile .s{font-size:12px;color:var(--muted)}
.tile .s.low{color:var(--warn);font-weight:700}
.tile .badge{position:absolute;top:-8px;right:-6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:800;font-size:15px;padding:0 6px}
.tile.propio{border-style:dashed}
/* lists */
.list{display:grid}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{min-width:0;flex:1}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted)}
.amt{font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.hero{background:var(--fg);color:var(--bg);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.hero .lbl{color:inherit;opacity:.75}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:19px;margin-bottom:4px}
.banner{background:var(--warn-soft);color:var(--fg);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6;padding:0 12px 8px;pointer-events:none}
.cartbar button{pointer-events:auto;width:100%;max-width:696px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;font-weight:800;font-size:17px;box-shadow:0 6px 20px rgb(0 0 0 / .22)}
.cartbar .t{font-family:var(--display);font-size:22px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:6px 2px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);min-height:56px}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs .dot{position:relative}
nav.tabs .dot[data-n]::after{content:attr(data-n);position:absolute;top:-6px;right:-12px;background:var(--warn);color:var(--surface);font-size:11px;border-radius:99px;padding:0 5px;line-height:17px}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgb(10 14 12 / .5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--sunk);border-radius:999px;width:40px;height:40px;font-size:20px;line-height:1}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:10px;border:0;background:var(--sunk);font-size:20px;font-weight:800}
.qty span{min-width:28px;text-align:center;font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 6px 20px rgb(0 0 0 / .25);max-width:calc(100% - 32px);text-align:center}
.status{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>

<header class="top">
  <h1>Mi Tiendita</h1>
  <div class="hoy"><span id="hoyFecha"></span><br>Hoy vendí <b class="num" id="hoyTotal">$0</b></div>
</header>
<main id="app"></main>
<div class="cartbar" id="cartbar" hidden><button id="cartBtn" type="button"><span id="cartN"></span><span class="t num" id="cartT"></span></button></div>
<nav class="tabs" id="tabs" aria-label="Secciones">
  <button type="button" data-tab="vender"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>Vender</button>
  <button type="button" data-tab="fiado"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h4"/></svg>Fiado</button>
  <button type="button" data-tab="surtir"><span class="dot" id="surtirDot"><svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span>Surtir</button>
  <button type="button" data-tab="hacer"><svg viewBox="0 0 24 24"><path d="M6 10h12l-1.5 10h-9z"/><path d="M8 10a4 4 0 0 1 8 0"/><path d="M10 6.5c0-1.5 1-2.5 2-2.5s2 1 2 2.5"/></svg>Lo que hago</button>
  <button type="button" data-tab="cuentas"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Cuentas</button>
</nav>
<div id="layer"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(n<0?"-":"")+"$"+Math.abs(Math.round((+n||0)*100)/100).toLocaleString("es-MX",{minimumFractionDigits:Math.abs(n)%1?2:0,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hhmm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const today=()=>ymd(new Date());
const monthKey=d=>d.slice(0,7);
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fechaLarga=s=>{const [y,m,d]=s.split("-");return +d+" de "+MESES[+m-1]};
const numIn=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const GASTO_CATS=["Mercancía","Insumos","Luz","Gas","Agua","Transporte","Otro"];
const INVENTARIO_CATS=["Mercancía","Insumos"];

/* ---------- state ---------- */
const S={
  tab:ls.get("tab","vender"), lugar:ls.get("lugar","Tienda"), cat:"Todo", q:"",
  productos:[], ejemplo:false, clientes:[], recetas:[], dias:{},
  cart:{}, loaded:{p:false,c:false,r:false,d:false}, dbState:"ok", respaldo:null, cobro:{}, otroMes:null
};

/* ---------- storage: IndexedDB on this phone ---------- */
const SEED_PRODUCTOS=[
 {id:"p01",nombre:"Coca-Cola 600 ml",cat:"Refrescos",precio:22,costo:16.5,stock:12,min:6,tipo:"reventa"},
 {id:"p02",nombre:"Coca-Cola 2 L",cat:"Refrescos",precio:42,costo:33,stock:4,min:3,tipo:"reventa"},
 {id:"p03",nombre:"Agua 1 L",cat:"Refrescos",precio:12,costo:7,stock:3,min:6,tipo:"reventa"},
 {id:"p04",nombre:"Sabritas 45 g",cat:"Botanas",precio:20,costo:15,stock:8,min:5,tipo:"reventa"},
 {id:"p05",nombre:"Ruffles 45 g",cat:"Botanas",precio:21,costo:16,stock:2,min:4,tipo:"reventa"},
 {id:"p06",nombre:"Gansito",cat:"Pan y galletas",precio:18,costo:13.5,stock:5,min:4,tipo:"reventa"},
 {id:"p07",nombre:"Pan Bimbo grande",cat:"Pan y galletas",precio:52,costo:44,stock:1,min:2,tipo:"reventa"},
 {id:"p08",nombre:"Leche 1 L",cat:"Abarrotes",precio:29,costo:24,stock:4,min:4,tipo:"reventa"},
 {id:"p09",nombre:"Huevo (kg)",cat:"Abarrotes",precio:48,costo:40,stock:3,min:2,tipo:"reventa"},
 {id:"p10",nombre:"Paleta Payaso",cat:"Dulces",precio:15,costo:11,stock:6,min:6,tipo:"reventa"},
 {id:"p11",nombre:"Chicle",cat:"Dulces",precio:2,costo:1.2,stock:40,min:20,tipo:"reventa"},
 {id:"p12",nombre:"Boli de fresa",cat:"Lo que hago",precio:8,costo:2.6,stock:30,min:15,tipo:"propio"},
 {id:"p13",nombre:"Palomitas (bolsa)",cat:"Lo que hago",precio:15,costo:4.2,stock:0,min:20,tipo:"propio"},
 {id:"p14",nombre:"Chicharrón embolsado",cat:"Lo que hago",precio:15,costo:6.67,stock:10,min:10,tipo:"propio"}];
const SEED_RECETAS=[
 {id:"r1",nombre:"Palomitas",pid:"p13",rinde:20,insumos:[{n:"Maíz palomero 1 kg",c:45},{n:"Aceite 250 ml",c:12},{n:"Sal",c:2},{n:"Bolsas (20)",c:25}]},
 {id:"r2",nombre:"Bolis de fresa",pid:"p12",rinde:30,insumos:[{n:"Polvo sabor fresa",c:20},{n:"Azúcar 1 kg",c:28},{n:"Bolsitas (30)",c:20},{n:"Agua de garrafón",c:10}]},
 {id:"r3",nombre:"Chicharrones embolsados",pid:"p14",rinde:12,insumos:[{n:"Chicharrón de harina 1 kg",c:55},{n:"Bolsas (12)",c:10},{n:"Salsa y limón",c:15}]}];
const kv={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("mi-tiendita",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>{kv.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  all(){return new Promise((res,rej)=>{const out={},tx=kv.db.transaction("kv"),c=tx.objectStore("kv").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})},
  put(k,v){return new Promise((res,rej)=>{const tx=kv.db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
  clear(){return new Promise((res,rej)=>{const tx=kv.db.transaction("kv","readwrite");tx.objectStore("kv").clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
};
const queues={};
function save(path,data){
  if(!kv.db)return Promise.resolve();
  const copy=JSON.parse(JSON.stringify(data));
  queues[path]=(queues[path]||Promise.resolve()).then(()=>kv.put(path,copy)).catch(()=>toast("No se pudo guardar. El celular puede estar sin espacio."));
  return queues[path];
}
const saveProductos=()=>save("tienda/productos",{items:S.productos,ejemplo:S.ejemplo});
const saveClientes=()=>save("tienda/fiado",{clientes:S.clientes});
const saveRecetas=()=>save("tienda/recetas",{items:S.recetas});
const saveCobro=()=>save("tienda/cobro",S.cobro);
const tieneCobro=()=>!!(S.cobro.qr||S.cobro.cel||S.cobro.clabe);
function dia(f){if(!S.dias[f])S.dias[f]={fecha:f,ventas:[],gastos:[]};return S.dias[f]}
const saveDia=f=>save("dias/"+f,S.dias[f]);
function cargar(all){
  const p=all["tienda/productos"],c=all["tienda/fiado"],r=all["tienda/recetas"];
  S.productos=p?p.items||[]:[];S.ejemplo=p?!!p.ejemplo:false;
  S.clientes=c?(c.clientes||[]).map(x=>({...x,movs:x.movs||[]})):[];
  S.recetas=r?r.items||[]:[];
  S.dias={};Object.keys(all).forEach(k=>{if(k.startsWith("dias/")){const v=all[k];S.dias[v.fecha]={fecha:v.fecha,ventas:v.ventas||[],gastos:v.gastos||[]}}});
  S.respaldo=all["meta/respaldo"]||null;
  S.cobro=all["tienda/cobro"]||{};
  S.loaded={p:true,c:true,r:true,d:true};
}
async function boot(){
  render();
  try{
    await kv.open();
    let all=await kv.all();
    if(!all["tienda/productos"]){
      await kv.put("tienda/productos",{items:SEED_PRODUCTOS,ejemplo:true});
      await kv.put("tienda/recetas",{items:SEED_RECETAS});
      await kv.put("tienda/fiado",{clientes:[]});
      all=await kv.all();
    }
    cargar(all);
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  }catch(e){S.dbState="error";S.loaded={p:true,c:true,r:true,d:true}}
  render();
}
/* ---------- respaldo (backup) ---------- */
async function respaldoArchivo(){
  const all=await kv.all();delete all["meta/respaldo"];
  const txt=JSON.stringify({app:"mi-tiendita",version:1,fecha:today(),datos:all});
  return new File([txt],"respaldo-tiendita-"+today()+".json",{type:"application/json"});
}
async function marcarRespaldo(){S.respaldo=today();await kv.put("meta/respaldo",S.respaldo);render();if(document.getElementById("bShare"))abrirRespaldo()}
async function compartirRespaldo(){
  const f=await respaldoArchivo();
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Respaldo Mi Tiendita"});await marcarRespaldo();toast("Respaldo enviado");return}
  }catch(e){if(e&&e.name==="AbortError")return}
  descargarRespaldo(f);
}
async function descargarRespaldo(f){
  f=f||await respaldoArchivo();
  const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);

}
function recuperarRespaldo(file){
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const j=JSON.parse(rd.result);
      if(j.app!=="mi-tiendita"||!j.datos)throw 0;
      await kv.clear();
      for(const k of Object.keys(j.datos))await kv.put(k,j.datos[k]);
      await kv.put("meta/respaldo",j.fecha||today());
      cargar(await kv.all());close();render();toast("Datos recuperados del "+fechaLarga(j.fecha||today()));
    }catch(e){toast("Ese archivo no es un respaldo de Mi Tiendita")}
  };
  rd.readAsText(file);
}

function resumen(dias,mes){
  const r={ventas:0,efectivo:0,transfer:0,fiado:0,costo:0,lugar:{},gastosOp:0,compras:0,gastos:[],top:{},abonos:0,prestamos:0,dias:new Set()};
  dias.forEach(d=>{
    (d.ventas||[]).forEach(v=>{const t=v.c*v.p;r.ventas+=t;r.costo+=v.c*(v.co||0);r[v.pago==="fiado"?"fiado":v.pago==="transferencia"?"transfer":"efectivo"]+=t;r.lugar[v.l]=(r.lugar[v.l]||0)+t;r.top[v.n]=(r.top[v.n]||0)+v.c;r.dias.add(d.fecha)});
    (d.gastos||[]).forEach(g=>{r.gastos.push({...g,f:d.fecha});if(INVENTARIO_CATS.includes(g.cat))r.compras+=g.m;else r.gastosOp+=g.m});
  });
  S.clientes.forEach(c=>(c.movs||[]).forEach(m=>{if(monthKey(m.f)===mes){if(m.tipo==="abono")r.abonos+=m.monto;if(m.tipo==="prestamo")r.prestamos+=m.monto}}));
  r.ganancia=r.ventas-r.costo-r.gastosOp;
  r.entro=r.efectivo+r.abonos+r.transfer; r.salio=r.compras+r.gastosOp+r.prestamos;
  return r;
}

function costoTanda(r){return (r.insumos||[]).reduce((a,i)=>a+(+i.c||0),0)}
function vHacer(){
  if(!S.loaded.r||!S.loaded.p)return loading();
  let h='<p class="muted" style="margin:0">Anota lo que gastas en cada tanda y cuántas piezas te salen. La app calcula cuánto te cuesta cada bolsa o boli y cuánto le ganas.</p>';
  if(!S.recetas.length)h+='<div class="card empty"><b>Aún no tienes recetas</b>Por ejemplo: palomitas, bolis o chicharrones embolsados.</div>';
  h+=S.recetas.map(r=>{const p=prod(r.pid),ct=costoTanda(r),cp=r.rinde?ct/r.rinde:0,pr=p?+p.precio:0,g=pr-cp,m=pr?g/pr:0;

    '<div class="bar" aria-label="Costo contra ganancia"><span style="width:'+Math.min(100,Math.max(0,(1-m)*100))+'%;background:var(--muted)"></span><span style="flex:1;background:var(--good)"></span></div>'+
    '<div class="sub muted num" style="font-size:13px">Una tanda cuesta '+money(ct)+' y salen '+(r.rinde||0)+' piezas · ganas '+money(g*(r.rinde||0))+' por tanda'+(p?' · tienes '+(+p.stock||0)+' listas':'')+'</div>'+
    '<button class="btn pri" type="button" data-act="tanda" data-id="'+r.id+'">Hice una tanda (+'+(r.rinde||0)+')</button></div>'}).join("");
  h+='<button class="btn ghost wide" type="button" data-act="editRec">+ Nueva receta</button>';

function editRec(id){
  const r=id?S.recetas.find(x=>x.id===id):{id:uid(),nombre:"",pid:"",insumos:[{n:"",c:""}],rinde:""};
  if(!r)return;
  let ins=r.insumos.map(i=>({...i}));
  const draw=()=>{
    const propios=S.productos.filter(p=>p.tipo==="propio");
    sheet(id?"Editar receta":"Nueva receta",
      '<label class="f">¿Qué preparas?<input id="rN" value="'+esc(r.nombre)+'" placeholder="Ej. Palomitas"></label>'+

      '<div class="lbl">Lo que gastas por tanda</div><div class="stack" id="insL">'+ins.map((i,k)=>'<div class="row" style="flex-wrap:nowrap"><input data-in="'+k+'" data-f="n" value="'+esc(i.n)+'" placeholder="Ej. Maíz 1 kg" style="flex:2;min-width:0"><input data-in="'+k+'" data-f="c" type="number" inputmode="decimal" value="'+esc(i.c)+'" placeholder="$" style="flex:1;min-width:0"><button class="x" type="button" data-rm="'+k+'" aria-label="Quitar">×</button></div>').join("")+'</div>'+
      '<button class="btn ghost sm" type="button" id="addIn">+ Agregar otro gasto</button>'+
      '<label class="f">¿Cuántas piezas te salen por tanda?<input id="rR" type="number" inputmode="numeric" value="'+esc(r.rinde)+'"></label>'+
      '<div id="rRes" class="card"></div>'+
      '<button class="btn pri wide" type="button" id="rOk">Guardar receta</button>'+(id?'<button class="btn danger" type="button" id="rDel">Borrar receta</button>':''),
      el=>{
        const res=()=>{const ct=ins.reduce((a,i)=>a+numIn(i.c),0),rr=numIn(el.querySelector("#rR").value);el.querySelector("#rRes").innerHTML='Una tanda cuesta <b class="num">'+money(ct)+'</b>'+(rr?' · cada pieza te sale en <b class="num">'+money(ct/rr)+'</b>':'')};
        el.addEventListener("input",e=>{const t=e.target;if(t.dataset.in!=null)ins[+t.dataset.in][t.dataset.f]=t.value;r.nombre=el.querySelector("#rN").value;r.rinde=el.querySelector("#rR").value;res()});
        el.querySelector("#rP").onchange=e=>{r.pid=e.target.value};
        res();
        el.querySelector("#addIn").onclick=()=>{ins.push({n:"",c:""});draw()};
        el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ins.splice(+b.dataset.rm,1);if(!ins.length)ins.push({n:"",c:""});draw()});
        el.querySelector("#rOk").onclick=()=>{
          const nombre=el.querySelector("#rN").value.trim(),rinde=Math.round(numIn(el.querySelector("#rR").value));
          if(!nombre||rinde<=0){toast("Escribe qué preparas y cuántas piezas salen");return}
          r.nombre=nombre;r.rinde=rinde;r.insumos=ins.filter(i=>i.n||numIn(i.c)).map(i=>({n:i.n.trim(),c:numIn(i.c)}));
          const cp=costoTanda(r)/rinde;
          let p=prod(el.querySelector("#rP").value);
          if(!p){p={id:uid(),nombre,cat:"Lo que hago",precio:Math.ceil(cp*2),costo:cp,stock:0,min:10,tipo:"propio"};S.productos.push(p)}
          else p.costo=Math.round(cp*100)/100;
          r.pid=p.id;
          if(!id)S.recetas.push(r);
          saveRecetas();saveProductos();close();render();toast("Receta guardada");
        };
        const d=el.querySelector("#rDel");if(d)d.onclick=e=>{if(!armed(e.target))return;S.recetas=S.recetas.filter(x=>x.id!==id);saveRecetas();close();render()};
      });
  };
  draw();
}

function achicarImagen(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const max=900,k=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");
      cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);res(cv.toDataURL("image/png"))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};
    img.src=url;
  });
}

/* ---- Resumen para WhatsApp ---- */
function textoResumen(){
  const mes=S.otroMes?S.otroMes.mes:monthKey(today());
  const dias=S.otroMes?S.otroMes.dias:Object.values(S.dias).filter(d=>monthKey(d.fecha)===mes);
  const r=resumen(dias,mes),[y,m]=mes.split("-");
  const deudores=S.clientes.map(c=>[c.nombre,saldo(c)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const deben=deudores.reduce((a,x)=>a+x[1],0);
  const surtir=porSurtir();
  const top=Object.entries(r.top).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const L=[];
  L.push("*Mi Tiendita – "+MESES[+m-1][0].toUpperCase()+MESES[+m-1].slice(1)+" "+y+"*");
  if(!S.otroMes)L.push("(al "+fechaLarga(today())+")");
  L.push("");
  L.push("Vendí: "+money(r.ventas));
  L.push("  · Tienda "+money(r.lugar.Tienda||0)+" · Secundaria "+money(r.lugar.Secundaria||0));
  L.push("  · Efectivo "+money(r.efectivo)+" · Transferencia "+money(r.transfer)+" · Fiado "+money(r.fiado));
  L.push("*Gané: "+money(r.ganancia)+"*");
  L.push("Gastos (luz, gas, etc.): "+money(r.gastosOp));
  L.push("Compré mercancía e insumos: "+money(r.compras));
  L.push("");
  L.push("Me deben: "+money(deben)+(deudores.length?"":" (nadie)"));
  deudores.slice(0,10).forEach(([n,v])=>L.push("  · "+n+" "+money(v)));
  if(top.length){L.push("");L.push("Lo que más vendí: "+top.map(([n,c])=>n+" ("+c+")").join(", "))}
  if(!S.otroMes){L.push("");L.push("Para surtir necesito: "+money(surtir.reduce((a,p)=>a+sugerido(p)*(+p.costo||0),0))+(surtir.length?" ("+surtir.map(p=>p.nombre).slice(0,6).join(", ")+")":""))}
  return L.join("\n");
}
async function mandarResumen(){
  const txt=textoResumen();
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}
  window.location.href="https://wa.me/?text="+encodeURIComponent(txt);
}

  h+='<div class="card stack"><h3>Dinero que entró y salió este mes</h3>'+
    '<div class="item"><div class="main"><div class="t">Entró</div><div class="sub num">Efectivo '+money(r.efectivo)+' + transferencias '+money(r.transfer)+' + abonos de fiado '+money(r.abonos)+'</div></div><span class="amt num" style="color:var(--good)">+'+money(r.entro)+'</span></div>'+
    '<div class="item"><div class="main"><div class="t">Salió</div><div class="sub num">Compras '+money(r.compras)+' + gastos '+money(r.gastosOp)+' + préstamos '+money(r.prestamos)+'</div></div><span class="amt num" style="color:var(--bad)">−'+money(r.salio)+'</span></div>'+
    '<div class="row between"><b>Quedó</b><span class="amt num">'+money(r.entro-r.salio)+'</span></div>'+
    (r.transfer?'<div class="muted" style="font-size:14px"><b class="num">'+money(r.transfer)+'</b> de eso está en tu banco, no en la caja.</div>':'')+
    (r.fiado?'<div class="muted" style="font-size:14px">Además vendiste <b class="num">'+money(r.fiado)+'</b> fiado que todavía no entra a la caja.</div>':'')+'</div>';
  // by place
  const lt=r.lugar.Tienda||0,lsec=r.lugar.Secundaria||0,tot=lt+lsec;
  h+='<div class="card stack"><h3>¿Dónde vendí más?</h3>'+(tot?'<div class="bar"><span style="width:'+(lt/tot*100)+'%;background:var(--accent)"></span><span style="flex:1;background:var(--good)"></span></div><div class="row between num"><span><span class="pill acc">Tienda</span> '+money(lt)+'</span><span><span class="pill good">Secundaria</span> '+money(lsec)+'</span></div>':'<div class="muted">Sin ventas este mes.</div>')+'</div>';
  // top
  const top=Object.entries(r.top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(top.length){const mx=top[0][1];h+='<div class="card stack"><h3>Lo que más se vende</h3>'+top.map(([n,c])=>'<div class="stack" style="gap:4px"><div class="row between"><span>'+esc(n)+'</span><b class="num">'+c+' pzas</b></div><div class="bar"><span style="width:'+(c/mx*100)+'%;background:var(--accent)"></span></div></div>').join("")+'</div>'}
  // gastos
  h+='<div class="card stack"><div class="row between"><h3>Gastos</h3>'+(S.otroMes?'':'<button class="btn sm pri" type="button" data-act="nuevoGasto">+ Anotar gasto</button>')+'</div>';
  const gs=r.gastos.sort((a,b)=>(b.f+b.h).localeCompare(a.f+a.h));
  if(gs.length){
    const porCat={};gs.forEach(g=>porCat[g.cat]=(porCat[g.cat]||0)+g.m);
    h+='<div class="chips">'+Object.entries(porCat).map(([c,v])=>'<span class="chip num" style="cursor:default">'+esc(c)+' '+money(v)+'</span>').join("")+'</div>';
    h+='<div class="list">'+gs.slice(0,40).map(g=>'<div class="item"><div class="main"><div class="t">'+esc(g.con)+'</div><div class="sub">'+fechaLarga(g.f)+' · '+esc(g.cat)+'</div></div><span class="amt num">'+money(g.m)+'</span>'+(S.otroMes?'':'<button class="x" type="button" data-act="delGasto" data-f="'+g.f+'" data-id="'+g.id+'" aria-label="Borrar gasto">×</button>')+'</div>').join("")+'</div>';
  } else h+='<div class="muted">Aún no hay gastos este mes. Anota la luz, el gas, el pasaje al mercado…</div>';
  h+='</div>';
  if(!S.otroMes)h+='<div class="card row between"><div class="main" style="min-width:0;flex:1"><h3>Mis datos de cobro</h3><div class="muted" style="font-size:14px">'+(tieneCobro()?'QR de CoDi y número para DiMo':'Agrega tu QR de CoDi y tu número para DiMo')+'</div></div><button class="btn sm pri" type="button" data-act="datosCobro">'+(tieneCobro()?'Ver o cambiar':'Agregar')+'</button></div>';
  if(!S.otroMes)h+='<div class="card row between"><div class="main" style="min-width:0;flex:1"><h3>Respaldo</h3><div class="muted" style="font-size:14px">'+(S.respaldo?'Último: '+fechaLarga(S.respaldo):'Aún no hay respaldo')+'</div></div><button class="btn sm pri" type="button" data-act="respaldo">Respaldar o recuperar</button></div>';
  return h;
}
function nuevoGasto(){
  sheet("Anotar gasto",
    '<label class="f">¿En qué gastaste?<input id="gC" placeholder="Ej. Recibo de luz"></label>'+
    '<label class="f">Cantidad<input id="gM" type="number" inputmode="decimal" placeholder="$"></label>'+
    '<div class="chips" id="gCats" style="flex-wrap:wrap">'+GASTO_CATS.map((c,i)=>'<button class="chip" type="button" data-c="'+c+'" aria-pressed="'+(c==="Otro")+'">'+c+'</button>').join("")+'</div>'+
    '<p class="muted" style="margin:0;font-size:14px">Mercancía e Insumos son compras para vender; no cuentan contra tu ganancia hasta que vendes. Luz, gas y pasajes sí.</p>'+
    '<button class="btn pri wide" type="button" id="gOk">Guardar gasto</button>',
    el=>{
      let cat="Otro";
      el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;el.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
      el.querySelector("#gOk").onclick=()=>{
        const con=el.querySelector("#gC").value.trim()||cat,m=numIn(el.querySelector("#gM").value);
        if(m<=0){toast("Escribe la cantidad");return}
        const f=today();dia(f).gastos.push({id:uid(),h:hhmm(new Date()),con,cat,m});saveDia(f);close();render();toast("Gasto anotado");
      };
    });
}
function cambiarMes(delta){
  const base=S.otroMes?S.otroMes.mes:monthKey(today());
  let [y,m]=base.split("-").map(Number);m+=delta;if(m<1){m=12;y--}if(m>12){m=1;y++}
  const mes=y+"-"+pad(m);
  if(mes>=monthKey(today())){S.otroMes=null;render();return}
  S.otroMes={mes,dias:Object.values(S.dias).filter(d=>monthKey(d.fecha)===mes)};render();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const tb=e.target.closest("#tabs button");if(tb){S.tab=tb.dataset.tab;ls.set("tab",S.tab);S.otroMes=null;window.scrollTo(0,0);render();window.scrollTo(0,0);return}
  if(e.target.closest("#cartBtn")){abrirCobro();return}
  const b=e.target.closest("#app [data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  if(a==="lugar"){S.lugar=v;ls.set("lugar",v);render()}
  else if(a==="cat"){S.cat=v;render()}
  else if(a==="add"){S.cart[id]=(S.cart[id]||0)+1;render()}
  else if(a==="cancelVenta"){if(armed(b,"¿Seguro?"))cancelVenta(b.dataset.t)}
  else if(a==="ejemploOk"){S.ejemplo=false;saveProductos();render()}
  else if(a==="addCli"){const i=$("#nuevoCli"),n=i.value.trim();if(!n){toast("Escribe el nombre");return}const c={id:uid(),nombre:n,movs:[]};S.clientes.push(c);saveClientes();render();verCli(c.id)}
  else if(a==="verCli")verCli(id);
  else if(a==="compre")compre(id);
  else if(a==="nuevoProd")editProd(null);
  else if(a==="editProd")editProd(id);
  else if(a==="tab"){S.tab=v;render();window.scrollTo(0,0)}
  else if(a==="editRec")editRec(id||null);
  else if(a==="tanda")tanda(id);
  else if(a==="nuevoGasto")nuevoGasto();
  else if(a==="delGasto"){if(!armed(b,"✓"))return;const d=dia(b.dataset.f);d.gastos=d.gastos.filter(g=>g.id!==id);saveDia(b.dataset.f);render()}
  else if(a==="mes")cambiarMes(+v);
  else if(a==="respaldo")abrirRespaldo();
  else if(a==="datosCobro")verMisDatos();
  else if(a==="resumenWA")mandarResumen();
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;render()}});

boot();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
